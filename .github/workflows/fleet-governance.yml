# 会社全体のリポジトリを対象にした継続的な脆弱性ガバナンス。
#
# 対象は登録制ではない。run ごとに governance/discover.py がオーナーの持ち物を
# GitHub API で数え直し、governance/exemptions.json に書かれたものだけを外す。
# 増えたリポジトリは、そのリポジトリ側が何もしなくても次の run から対象に入る。
#
# 2 段構成にしている理由:
#   scan       Trivy だけ。Cursor の枠を使わないので全リポジトリを並列に回せる。
#              「Org 配下の全プロジェクトが同時に検査されている」状態はここで作る。
#   remediate  Cloud Agent（triage → policy → 修正 PR → 影響分析）。プランの同時実行
#              Cloud Agent 数に上限があるので直列。CRITICAL が出たリポジトリだけ。
#
# 単一リポジトリ版は security-scan.yml。こちらはフリート全体を回す方。
name: fleet governance

on:
  schedule:
    # 毎日 18:00 UTC = 03:00 JST。
    # 注意 1: schedule と workflow_dispatch は **デフォルトブランチ上のワークフローしか**
    #         動かない。別ブランチで検証する間は push トリガーで回すこと。
    # 注意 2: GitHub の scheduled workflow はベストエフォートで、混雑時に数時間遅れる
    #         （実績で +3〜5 時間）。時刻を保証したいなら外部から dispatch する。
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      repos:
        description: "対象を絞る場合は owner/repo をカンマ区切り（空なら発見した全件）"
        required: false
        default: ""
      scan_only:
        description: "Trivy のスキャンだけ流す（Cloud Agent を起動しない）"
        type: boolean
        required: false
        default: false
      max_prs:
        description: "1 リポジトリ 1 回あたりに開く修正リクエストの上限（空なら 5）"
        required: false
        default: ""
      agent_concurrency:
        description: "1 リポジトリ内で同時に走らせる Cloud Agent 数（空なら 2）"
        required: false
        default: ""
  push:
    paths:
      # 統制の設定を変えたら、次の夜を待たずにカバレッジを取り直す。
      # ここにこのワークフロー自身を入れないこと。編集するたびにフリート全体の
      # Agent が動いて、同じ内容の PR が増える。
      - "governance/**"

permissions:
  contents: read
  # 横断サマリを Issue として起票する
  issues: write

jobs:
  # 対象を「発見」する。ここが登録制との違い。
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      count: ${{ steps.discover.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - id: discover
        env:
          # 既定のトークンでは public リポジトリしか列挙できない。private も統制対象に
          # するなら、Organization を読める GitHub App / PAT に差し替える（clone 側も同様）。
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILTER: ${{ inputs.repos }}
        run: python3 governance/discover.py
      - name: Report the scope
        env:
          SKIPPED: ${{ steps.discover.outputs.skipped }}
        run: |
          {
            echo "### Scope for this run"
            echo ""
            echo "${{ steps.discover.outputs.count }} repositories discovered and in scope."
            echo ""
            echo "Out of scope:"
            echo ""
            echo '```'
            printf '%s\n' "$SKIPPED"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # 検査。Trivy だけなので全リポジトリ同時。ここでトークンは 1 つも使わない。
  scan:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # GitHub Free の同時ジョブ上限は 20（Pro 40 / Team 60）。matrix は 1 run 256 まで。
      max-parallel: 20
      matrix:
        repo: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      SCAN_TRIVY_VERSION: 0.74.0
      SCAN_FLAGS: >-
        --scanners vuln --severity CRITICAL,HIGH,MEDIUM
        --skip-dirs target --skip-dirs cursor-sdk --skip-dirs node_modules
        --skip-dirs vendor --skip-dirs dist --skip-dirs .git
    steps:
      # 監査対象。public リポジトリなのでトークンは不要。
      # ディレクトリ名を target にしないこと。SCAN_FLAGS の --skip-dirs target
      # （対象リポジトリ内の Maven ビルド出力を除外する指定）がスキャン対象ごと
      # 除外してしまい、検出が常に 0 件になる。
      - name: Clone the target repository
        run: |
          git clone --depth 1 --branch "${{ matrix.repo.ref }}" "${{ matrix.repo.url }}.git" repo
          echo "HEAD: $(git -C repo rev-parse --short HEAD)"
      # 対象が Java でないと setup-java の cache が
      # 「No file in /home/runner/work/... matched to [**/pom.xml, ...]」で落ちる。
      # フリートには npm や Go のリポジトリも入るので、ツールチェーンを見てから入れる。
      - name: Detect the target's toolchain
        id: toolchain
        run: |
          if [ -f repo/pom.xml ]; then
            echo "java=true" >> "$GITHUB_OUTPUT"
            echo "maven_cache=maven" >> "$GITHUB_OUTPUT"
            echo "toolchain: Maven"
          elif ls repo/*.gradle repo/*.gradle.kts >/dev/null 2>&1; then
            # Gradle だけのリポジトリは pom.xml が無いので cache は付けない
            echo "java=true" >> "$GITHUB_OUTPUT"
            echo "maven_cache=" >> "$GITHUB_OUTPUT"
            echo "toolchain: Gradle"
          else
            echo "java=false" >> "$GITHUB_OUTPUT"
            echo "maven_cache=" >> "$GITHUB_OUTPUT"
            echo "toolchain: not a JVM repository; skipping the JDK"
          fi
      - uses: actions/setup-java@v4
        if: steps.toolchain.outputs.java == 'true'
        with:
          distribution: temurin
          java-version: "17"
          cache: ${{ steps.toolchain.outputs.maven_cache }}
      - name: Install Trivy
        run: |
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${SCAN_TRIVY_VERSION}/trivy_${SCAN_TRIVY_VERSION}_Linux-64bit.tar.gz" -o /tmp/trivy.tar.gz
          sudo tar -xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy
      - name: Cache the Trivy vulnerability DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-
      # Maven だけは POM を解決しないと Maven Central を叩いて 429 になりやすい。
      # 失敗しても pom.xml 自体はスキャンできるので続行する。
      - name: Resolve Maven dependencies (best effort)
        run: |
          if [ -f repo/pom.xml ] && [ -x repo/mvnw ]; then
            (cd repo && ./mvnw -B -DskipTests dependency:resolve) || echo "dependency:resolve failed; scanning the manifest only"
          else
            echo "not a Maven repository with a wrapper; nothing to resolve"
          fi
      - name: Scan (JSON)
        run: trivy fs ${SCAN_FLAGS} --format json --output "$GITHUB_WORKSPACE/trivy-report.json" repo
      - name: Scan (table for the log)
        run: trivy fs ${SCAN_FLAGS} --exit-code 0 --format table repo
      # 修正段が使う入力。ここで作った JSON をそのまま渡す（同じコミットを 2 回スキャンしない）。
      - name: Keep the report for the remediation phase
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report-${{ matrix.repo.key }}
          path: trivy-report.json
          if-no-files-found: error
      # 修正が走らなかったリポジトリもレポートに出したいので、検査結果だけの state を残す。
      # 修正まで走ったリポジトリは remediate 段の state が上書きする。
      - name: Summarize the scan
        if: always()
        run: |
          set -uo pipefail
          mkdir -p scan
          if [ -f trivy-report.json ]; then
            jq -c \
              --arg name "${{ matrix.repo.name }}" --arg slug "${{ matrix.repo.slug }}" \
              --arg ref "${{ matrix.repo.ref }}" \
              '[.Results[]? | select(.Vulnerabilities != null)] as $r
               | [$r[].Vulnerabilities[]] as $v
               | {
                   fleetName: $name, fleetSlug: $slug, fleetRef: $ref,
                   ecosystems: ($r | map(.Type) | unique),
                   findings: {
                     total: ($v | length),
                     bySeverity: {
                       CRITICAL: ([$v[] | select(.Severity == "CRITICAL")] | length),
                       HIGH:     ([$v[] | select(.Severity == "HIGH")]     | length),
                       MEDIUM:   ([$v[] | select(.Severity == "MEDIUM")]   | length)
                     },
                     packageGroups: ($v | map(.PkgName) | unique | length)
                   }
                 }' trivy-report.json > "scan/${{ matrix.repo.key }}.json"
          else
            jq -n --arg name "${{ matrix.repo.name }}" --arg slug "${{ matrix.repo.slug }}" \
              --arg ref "${{ matrix.repo.ref }}" \
              '{fleetName: $name, fleetSlug: $slug, fleetRef: $ref, error: "the scan did not produce a report"}' \
              > "scan/${{ matrix.repo.key }}.json"
          fi
          cat "scan/${{ matrix.repo.key }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scan-state-${{ matrix.repo.key }}
          path: scan/${{ matrix.repo.key }}.json
          if-no-files-found: warn

  # 検査結果を見て、修正段に渡すリポジトリだけを選ぶ。
  # CRITICAL が 0 件のリポジトリに Cloud Agent を起こさない。トークンの消費は
  # 「検査した回数」ではなく「直す回数」に比例させたい。
  triage-gate:
    needs: [plan, scan]
    if: always() && needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      count: ${{ steps.select.outputs.count }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: scan-state-*
          path: scan
          merge-multiple: true
      - id: select
        env:
          MATRIX: ${{ needs.plan.outputs.matrix }}
        run: |
          set -uo pipefail
          ACTIONABLE=$(jq -s -c '[.[] | select((.findings.bySeverity.CRITICAL // 0) > 0) | .fleetSlug]' scan/*.json 2>/dev/null || echo '[]')
          echo "repositories with CRITICAL findings: ${ACTIONABLE}"
          OUT=$(jq -c --argjson actionable "$ACTIONABLE" '[.[] | select(.slug as $s | $actionable | index($s))]' <<<"$MATRIX")
          echo "matrix=${OUT}" >> "$GITHUB_OUTPUT"
          echo "count=$(jq 'length' <<<"$OUT")" >> "$GITHUB_OUTPUT"
          jq -r '.[] | "  will remediate \(.slug)@\(.ref)"' <<<"$OUT"

  # 修正。ここだけ Cloud Agent を使うので直列。
  remediate:
    needs: [plan, triage-gate]
    # push（統制の設定変更）では走らせない。設定を触るたびに PR が増えるのを避ける。
    # デモで検査の広がりだけ見せたいときは scan_only を立てる。
    if: >-
      needs.triage-gate.outputs.count != '0'
      && github.event_name != 'push'
      && inputs.scan_only != true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # 1 リポジトリあたり最大 3 エージェント（triage / fix / impact）が動く。
      # 並列にすると Cursor プランの同時実行 Cloud Agent 数の上限
      # （"You've reached the limit for your current plan"）に当たるので直列にする。
      # 同時に走る Cloud Agent の総数は、ここ（リポジトリの並列度）×
      # VULN_AGENT_CONCURRENCY（1 リポジトリ内の並列度）になる。プランごとの上限は
      # 公開されていないので、数を当てにいかず 1 箇所（リポジトリ内）で握る。
      # 上限に当たっても createWithRetry が待って埋め直すので、run は落ちない。
      max-parallel: 1
      matrix:
        repo: ${{ fromJSON(needs.triage-gate.outputs.matrix) }}
    env:
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      # 対象リポジトリを Cloud Agent に渡す。SHA ではなくブランチ名
      # （push 直後のコミット SHA は validation_error になる）
      CURSOR_REPO_URL: ${{ matrix.repo.url }}
      CURSOR_STARTING_REF: ${{ matrix.repo.ref }}
      VULN_HOST: github
      VULN_RUNTIME: cloud
      # 1 パッケージグループ = 1 リクエスト。レビューできる本数に上限を置く。
      VULN_MAX_PULL_REQUESTS: ${{ inputs.max_prs }}
      # グループ間に依存が無いので直列にする理由が無い。トークンは Agent が働いた量に
      # 比例するため、並列度を上げても費用は増えず待ち時間だけ縮む。
      VULN_AGENT_CONCURRENCY: ${{ inputs.agent_concurrency }}
      # 既に開いているリクエストを Agent を起こす前に調べるために使う。
      # public リポジトリなら無くても読めるが、レート制限に当たりにくくなる。
      # private を統制対象にするなら、対象を読めるトークンに差し替えること。
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check for CURSOR_API_KEY
        id: guard
        run: |
          if [ -z "${CURSOR_API_KEY}" ]; then
            echo "CURSOR_API_KEY is not set; scanning only, no remediation" >> "$GITHUB_STEP_SUMMARY"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      # オーケストレータのコード（この repo）
      - uses: actions/checkout@v4
        with:
          path: control
      - name: Clone the target repository
        run: |
          git clone --depth 1 --branch "${{ matrix.repo.ref }}" "${{ matrix.repo.url }}.git" repo
          echo "HEAD: $(git -C repo rev-parse --short HEAD)"
      # 検査段の結果を使う。同じコミットを 2 回スキャンしない。
      - uses: actions/download-artifact@v4
        with:
          name: trivy-report-${{ matrix.repo.key }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: control/cursor-sdk/package-lock.json
      - name: Triage, policy, fix PR, impact analysis
        if: steps.guard.outputs.enabled == 'true'
        working-directory: control/cursor-sdk
        run: |
          npm ci
          npx tsx src/cli.ts run \
            --report "$GITHUB_WORKSPACE/trivy-report.json" \
            --cwd "$GITHUB_WORKSPACE/repo" \
            --runtime cloud
      # 対象リポジトリ側に書かれた state を横断レポート用に回収する
      - name: Collect the result
        if: always()
        run: |
          mkdir -p out
          if [ -f repo/.cursor/vuln-orchestrator-state.json ]; then
            jq -c --arg name "${{ matrix.repo.name }}" --arg slug "${{ matrix.repo.slug }}" --arg ref "${{ matrix.repo.ref }}" \
              '. + {fleetName: $name, fleetSlug: $slug, fleetRef: $ref}' \
              repo/.cursor/vuln-orchestrator-state.json > "out/${{ matrix.repo.key }}.json"
          else
            jq -n --arg name "${{ matrix.repo.name }}" --arg slug "${{ matrix.repo.slug }}" --arg ref "${{ matrix.repo.ref }}" \
              '{fleetName: $name, fleetSlug: $slug, fleetRef: $ref, error: "no state file (the orchestrator failed)"}' \
              > "out/${{ matrix.repo.key }}.json"
          fi
          cat "out/${{ matrix.repo.key }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fleet-state-${{ matrix.repo.key }}
          path: out/${{ matrix.repo.key }}.json
          if-no-files-found: warn

  # 横断サマリ。Job Summary と Issue の両方に出す。
  report:
    needs: [plan, scan, triage-gate, remediate]
    if: always() && needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
      # 検査だけのリポジトリは scan-state、修正まで走ったリポジトリは fleet-state を持つ。
      # 同じ slug は修正側を採る。
      - uses: actions/download-artifact@v4
        with:
          pattern: scan-state-*
          path: scan
          merge-multiple: true
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: fleet-state-*
          path: remediated
          merge-multiple: true
      - name: Merge the two phases into one state per repository
        run: |
          mkdir -p states
          cp -f scan/*.json states/ 2>/dev/null || true
          cp -f remediated/*.json states/ 2>/dev/null || true
          ls -la states/
      - name: Render the fleet report
        env:
          MATRIX: ${{ needs.plan.outputs.matrix }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 control/governance/render-report.py
      - name: Publish the report as an Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "$(cat report-title.txt)" \
            --body-file report.md
